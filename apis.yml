name: Travelstop
description: 'Travelstop (rebranded WegoPro) is a modern corporate travel and expense
  management platform founded in Singapore and backed by Accel. Companies use it to
  book flights and hotels from multiple supply partners, enforce travel policy and
  approval workflows, and automate expense reporting with receipt scanning (OCR),
  duplicate detection, and fraud prevention. Expense and accounting data syncs to
  Xero and QuickBooks, and native iOS and Android apps support travelers on the move.
  The product exposes prebuilt in-app accounting integrations rather than a public,
  self-serve developer API; this profile enriches its public web, security, and identity
  surface.'
